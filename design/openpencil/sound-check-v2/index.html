<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicLine · Guided sound check</title>
<link rel="stylesheet" href="style.css">
<body><header class="review"><span>MICLINE / EXPERIENCE STUDY 02</span><span>Interactive design · simulated audio and permissions</span><label>Review state <select id="jump"></select></label></header>
<main class="stage"><section class="window" aria-label="Sound check"><div class="chrome"><strong>Sound Check</strong><button id="end" class="quiet">Set Up Later</button></div><nav aria-label="Setup chapters"><span>Your mic</span><span>Your sound</span><span>Your apps</span></nav><div class="content"><p id="eyebrow"></p><h1 id="title" tabindex="-1"></h1><p id="body"></p><div id="control"></div><p id="detail"></p></div><footer><button id="back" class="quiet">Back</button><button id="secondary" class="quiet"></button><button id="next" class="primary"></button></footer></section>
<aside class="companion" aria-label="Video companion"><div class="companion-top"><span>Quick Guide</span><button class="quiet" id="hide-video" aria-label="Collapse demonstration">−</button></div><div id="media"></div><div class="companion-copy"><h2 id="lesson"></h2><p id="caption"></p><button id="read" class="quiet">Read the steps</button><ol id="transcript" hidden></ol></div></aside></main>
<div class="review-controls"><span>Explore a recovery:</span><button id="branch"></button><button id="extra"></button><button data-go="disconnected">Device unplugged</button><button data-go="resume">Return later</button><button id="toggle-companion">Show / hide companion</button></div><p class="review-note">Approved design direction · PiP footage follows the finished app. This prototype does not access the microphone.</p>
<script src="flow.js"></script><script src="prototype.js"></script></body></html>
