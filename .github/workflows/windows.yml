name: Windows desktop test build

on:
  push:
    branches: ['windows/main']
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Configure native x64 tools
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5
        with:
          arch: x64
      - name: Install official Swift toolchain
        uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
        with:
          branch: swift-6.2.3-release
          tag: 6.2.3-RELEASE
          build_arch: amd64
      - name: Compile native Windows executable
        working-directory: Windows
        run: |
          swift --version
          swift build -c release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = swift build -c release --show-bin-path
          try {
            $test = Start-Process "$bin/MicLine.exe" -ArgumentList '--self-test' -Wait -PassThru
          } catch {
            & mt.exe -nologo "-inputresource:$bin/MicLine.exe;#1" -out:embedded.manifest
            if (Test-Path embedded.manifest) { Get-Content embedded.manifest }
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='SideBySide'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction Continue |
              Select-Object -First 3 -ExpandProperty Message
            throw
          }
          if ($test.ExitCode -ne 0) { throw "Offline self-test failed: $($test.ExitCode)" }
          Write-Host 'Native Swift/DSP offline self-test passed'
      - name: Package app-local runtimes and installer
        run: ./Windows/package.ps1
      - name: Exercise native desktop fixtures without microphone access
        run: ./Windows/test-desktop.ps1
      - name: Upload tester installer and portable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MicLine-Windows-x64
          path: |
            Windows/dist/*.exe
            Windows/dist/*.zip
            Windows/dist/*.sha256
            Windows/dist/BUILD.txt
            Windows/README.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload native fixture captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-native-fixtures
          path: Windows/dist/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
