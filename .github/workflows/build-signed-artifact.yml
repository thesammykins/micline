name: Build signed release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString (for example, 0.1.0)
        required: true
        type: string
      build_number:
        description: Integer CFBundleVersion
        required: true
        type: string
      notarize:
        description: Submit to Apple, wait, and staple the DMG
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type SIGN_ARTIFACT_ONLY to authorize credential use
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-artifact:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'SIGN_ARTIFACT_ONLY' }}
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release-signing
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify macOS and SDK requirement before loading credentials
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }' | cut -d. -f1)" -ge 27 ]]
          ./scripts/build.sh --check-environment

      - name: Validate requested version values
        env:
          MICLINE_VERSION: ${{ inputs.version }}
          MICLINE_BUILD_NUMBER: ${{ inputs.build_number }}
          MICLINE_ENABLE_SIGNED_RELEASE: ${{ vars.MICLINE_ENABLE_SIGNED_RELEASE }}
          MICLINE_ALLOW_EPHEMERAL_CREDENTIAL_FILES: ${{ vars.MICLINE_ALLOW_EPHEMERAL_CREDENTIAL_FILES }}
          MICLINE_SPARKLE_FEED_URL: ${{ vars.MICLINE_SPARKLE_FEED_URL }}
          MICLINE_SPARKLE_PUBLIC_ED_KEY: ${{ vars.MICLINE_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          : "${MICLINE_ENABLE_SIGNED_RELEASE:?MICLINE_ENABLE_SIGNED_RELEASE repository variable is required}"
          [[ "$MICLINE_ENABLE_SIGNED_RELEASE" == "true" ]] || {
            echo "MICLINE_ENABLE_SIGNED_RELEASE must equal true" >&2
            exit 1
          }
          ./scripts/build.sh --check-release-configuration
          : "${MICLINE_ALLOW_EPHEMERAL_CREDENTIAL_FILES:?credential-file handling is not approved}"
          [[ "$MICLINE_ALLOW_EPHEMERAL_CREDENTIAL_FILES" == "true" ]] || {
            echo "Signed CI remains blocked: security import and notarytool require temporary credential files" >&2
            exit 1
          }

      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"

          KEYCHAIN_PATH="$RUNNER_TEMP/micline-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/micline-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build hardened Developer ID app
        env:
          MICLINE_SIGNING_MODE: developer-id
          MICLINE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          MICLINE_VERSION: ${{ inputs.version }}
          MICLINE_BUILD_NUMBER: ${{ inputs.build_number }}
          MICLINE_REQUIRE_APP_ICON: "1"
          MICLINE_SPARKLE_FEED_URL: ${{ vars.MICLINE_SPARKLE_FEED_URL }}
          MICLINE_SPARKLE_PUBLIC_ED_KEY: ${{ vars.MICLINE_SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/build.sh

      - name: Decode App Store Connect API key
        if: ${{ inputs.notarize }}
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${NOTARY_KEY_P8_BASE64:?APPLE_NOTARY_KEY_P8_BASE64 is required when notarize is enabled}"
          : "${NOTARY_KEY_ID:?APPLE_NOTARY_KEY_ID is required when notarize is enabled}"
          : "${NOTARY_ISSUER_ID:?APPLE_NOTARY_ISSUER_ID is required when notarize is enabled}"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Package signed artifact
        if: ${{ !inputs.notarize }}
        env:
          MICLINE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/package-dmg.sh \
            --app build/MicLine.app \
            --output "build/MicLine-$RELEASE_VERSION.dmg" \
            --volume-name "MicLine $RELEASE_VERSION" \
            --sign-dmg

      - name: Package and notarize signed artifact
        if: ${{ inputs.notarize }}
        env:
          MICLINE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/package-dmg.sh \
            --app build/MicLine.app \
            --output "build/MicLine-$RELEASE_VERSION.dmg" \
            --volume-name "MicLine $RELEASE_VERSION" \
            --sign-dmg \
            --notarize

      - name: Create artifact checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: shasum -a 256 "build/MicLine-$RELEASE_VERSION.dmg" > "build/MicLine-$RELEASE_VERSION.dmg.sha256"

      - name: Upload signed artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MicLine-${{ inputs.version }}-${{ github.run_id }}
          path: |
            build/MicLine-${{ inputs.version }}.dmg
            build/MicLine-${{ inputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing credentials and ephemeral keychain
        if: ${{ always() }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/micline-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/micline-signing.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
