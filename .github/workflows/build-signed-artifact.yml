name: Release MicLine

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: micline-release
  cancel-in-progress: false

jobs:
  signed-artifact:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write # Publish the verified tag's release assets.
    runs-on: xcode-27
    # Two 45-minute Apple waits plus build, packaging, verification, and cleanup.
    timeout-minutes: 150
    environment: release-signing
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Derive version from tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          ./scripts/release-version.py "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify macOS and SDK requirement before loading credentials
        run: |
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }' | cut -d. -f1)" -ge 27 ]]
          ./scripts/build.sh --check-environment

      - name: Test reviewed source and pinned Sparkle signing format
        run: |
          swift test --parallel
          swift build --product MicLine -c release
          ./scripts/verify-sparkle-fixture.sh

      - name: Validate requested version values
        env:
          MICLINE_VERSION: ${{ env.MICLINE_VERSION }}
          MICLINE_BUILD_NUMBER: ${{ env.MICLINE_BUILD_NUMBER }}
          MICLINE_SPARKLE_FEED_URL: ${{ vars.MICLINE_SPARKLE_FEED_URL }}
          MICLINE_SPARKLE_PUBLIC_ED_KEY: ${{ vars.MICLINE_SPARKLE_PUBLIC_ED_KEY }}
          MICLINE_SIGNING_CERTIFICATE_SHA1: ${{ vars.MICLINE_SIGNING_CERTIFICATE_SHA1 }}
        run: |
          ./scripts/build.sh --check-release-configuration
          [[ "$MICLINE_SIGNING_CERTIFICATE_SHA1" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "MICLINE_SIGNING_CERTIFICATE_SHA1 must pin the new MicLine Developer ID certificate" >&2
            exit 1
          }
          [[ "$MICLINE_SIGNING_CERTIFICATE_SHA1" == "EE3326E165ACAB5017293BFA8438034EFAC32F21" ]] || {
            echo "Only the reviewed MicLine Developer ID fingerprint is allowed" >&2
            exit 1
          }

      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MICLINE_SIGNING_CERTIFICATE_SHA1: ${{ vars.MICLINE_SIGNING_CERTIFICATE_SHA1 }}
        run: |
          : "${CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"

          KEYCHAIN_PATH="$RUNNER_TEMP/micline-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/micline-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          [[ "$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -v fingerprint="$MICLINE_SIGNING_CERTIFICATE_SHA1" '
            toupper($2) == toupper(fingerprint) && /"Developer ID Application:/ { matching++ }
            $1 ~ /^[0-9]+\)$/ && $2 ~ /^[[:xdigit:]]+$/ && length($2) == 40 { total++ }
            END { print matching + 0 ":" total + 0 }
          ')" == "1:1" ]] || {
            echo "The imported release keychain must contain only the pinned MicLine Developer ID identity" >&2
            exit 1
          }
          security find-certificate -c 'Developer ID Application: Samantha Myers (7GF6N5U8ZH)' -p "$KEYCHAIN_PATH" \
            | openssl x509 -noout -subject -fingerprint -sha256 \
            | tr -d ':' \
            | grep -F 'F1D0126217EEE0D868BAB6A9B8E9BBBE2D5D9630B20412D76E8626C596CCBBC5' >/dev/null || {
              echo "Imported certificate SHA-256 or team differs from reviewed MicLine identity" >&2
              exit 1
            }

      - name: Build hardened Developer ID app
        env:
          MICLINE_SIGNING_MODE: developer-id
          MICLINE_SIGNING_CERTIFICATE_SHA1: ${{ vars.MICLINE_SIGNING_CERTIFICATE_SHA1 }}
          MICLINE_VERSION: ${{ env.MICLINE_VERSION }}
          MICLINE_BUILD_NUMBER: ${{ env.MICLINE_BUILD_NUMBER }}
          MICLINE_REQUIRE_APP_ICON: "1"
          MICLINE_SPARKLE_FEED_URL: ${{ vars.MICLINE_SPARKLE_FEED_URL }}
          MICLINE_SPARKLE_PUBLIC_ED_KEY: ${{ vars.MICLINE_SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/build.sh

      - name: Install pinned asc for notarization
        run: |
          mkdir -p "$RUNNER_TEMP/asc-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/5.4.0/asc_5.4.0_macOS_arm64 \
            -o "$RUNNER_TEMP/asc-bin/asc"
          echo "191f2ece2baa3dab92d6094ce73fab62116ffc4d9e647b1fb70380e9faf15838  $RUNNER_TEMP/asc-bin/asc" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/asc-bin/asc"
          echo "$RUNNER_TEMP/asc-bin" >> "$GITHUB_PATH"

      - name: Notarize and staple app before packaging
        env:
          ASC_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          ASC_BYPASS_KEYCHAIN: "true"
          ASC_STRICT_AUTH: "true"
        run: |
          ditto -c -k --keepParent build/MicLine.app "$RUNNER_TEMP/MicLine.zip"
          ./scripts/notarize.sh "$RUNNER_TEMP/MicLine.zip" "$RUNNER_TEMP/micline-app-notary"
          xcrun stapler staple build/MicLine.app
          xcrun stapler validate build/MicLine.app
          rm -f "$RUNNER_TEMP/MicLine.zip"

      - name: Package signed artifact
        env:
          MICLINE_SIGNING_CERTIFICATE_SHA1: ${{ vars.MICLINE_SIGNING_CERTIFICATE_SHA1 }}
          RELEASE_VERSION: ${{ env.MICLINE_VERSION }}
        run: |
          ./scripts/package-dmg.sh \
            --app build/MicLine.app \
            --output "build/MicLine-$RELEASE_VERSION.dmg" \
            --volume-name "MicLine $RELEASE_VERSION" \
            --sign-dmg

      - name: Notarize and staple DMG
        env:
          RELEASE_VERSION: ${{ env.MICLINE_VERSION }}
          ASC_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          ASC_BYPASS_KEYCHAIN: "true"
          ASC_STRICT_AUTH: "true"
        run: |
          dmg="build/MicLine-$RELEASE_VERSION.dmg"
          ./scripts/notarize.sh "$dmg" "$RUNNER_TEMP/micline-dmg-notary"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          mount="$RUNNER_TEMP/micline-verify"
          mkdir -p "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          test -L "$mount/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount/MicLine.app"
          xcrun stapler validate "$mount/MicLine.app"
          spctl --assess --type execute --verbose=4 "$mount/MicLine.app"

      - name: Create artifact checksum
        env:
          RELEASE_VERSION: ${{ env.MICLINE_VERSION }}
        run: shasum -a 256 "build/MicLine-$RELEASE_VERSION.dmg" > "build/MicLine-$RELEASE_VERSION.dmg.sha256"

      - name: Sign Sparkle feed and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/publish-release.sh

      - name: Upload public update feed
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

      - name: Remove signing credentials and ephemeral keychain
        if: ${{ always() }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/micline-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/micline-signing.p12" "$RUNNER_TEMP/micline-notary.p8" "$RUNNER_TEMP/MicLine.zip"

  deploy-feed:
    needs: signed-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Deploy only the signed feed artifact from the release job.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed update feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
