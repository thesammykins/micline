name: Validate release tooling

on:
  pull_request:
    paths:
      - ".github/gitleaks.toml"
      - ".github/workflows/**"
      - "scripts/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Resources/**"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
  push:
    paths:
      - ".github/gitleaks.toml"
      - ".github/workflows/**"
      - "scripts/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "Resources/**"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned actionlint and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate workflows, shell, and property lists
        run: |
          actionlint
          bash -n scripts/build.sh scripts/package-dmg.sh scripts/verify-sparkle-fixture.sh scripts/notarize.sh scripts/publish-release.sh
          shellcheck scripts/build.sh scripts/package-dmg.sh scripts/verify-sparkle-fixture.sh scripts/notarize.sh scripts/publish-release.sh
          python3 scripts/test-notarize.py
          python3 scripts/test-release-tooling.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          for path in (Path("Resources/Info.plist"), Path("Resources/MicLine.entitlements")):
              with path.open("rb") as stream:
                  plistlib.load(stream)
              print(f"valid plist: {path}")
          PY


  build-test:
    if: ${{ github.ref != 'refs/heads/windows/main' && github.head_ref != 'windows/main' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Assert hosted image contract
        run: |
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ]]
          xcodebuild -version
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }' | cut -d. -f1)" -ge 27 ]]
          [[ "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27 ]]
          ./scripts/build.sh --check-environment

      - name: Build and test without signing credentials
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          swift build --product MicLine -c release --sdk "$sdk_path" --arch arm64
          swift test --sdk "$sdk_path"
          ./scripts/verify-sparkle-fixture.sh
          swiftc -typecheck scripts/generate-dmg-background.swift
          otool -l .build/out/Products/Release/MicLine | grep -F '@executable_path/../Frameworks'

      - name: Verify x86_64 cross-build feasibility only
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          swift build \
            --product MicLine \
            -c release \
            --sdk "$sdk_path" \
            --arch x86_64 \
            --scratch-path .build/ci-x86_64
          lipo -archs .build/ci-x86_64/out/Products/Release/MicLine | grep -qw x86_64
          echo "x86_64 cross-build passed; macOS 27 has no supported Intel Mac runtime target"
