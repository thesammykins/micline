name: MicLine problem
description: Report an audio, effect, interface, installation or update problem.
title: "[Problem]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach microphone recordings, presets/plugin state, certificates,
        keys, raw Console logs or personal paths. Review exported diagnostics and
        crop screenshots before attaching. For vulnerabilities, follow SECURITY.md
        and use GitHub private vulnerability reporting, not this issue form.
        MicLine does not submit this form for you.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Microphone / virtual-output routing
        - Physical monitoring
        - Audio Unit effect / editor
        - Meters / interface / accessibility
        - Installation / startup / Dock
        - Updates / signing
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App and environment
      description: App/build/macOS versions. Add hardware model and driver version if relevant, without custom device names or unique IDs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1. Select ...
        2. Start / change ...
        3. Observe ...
      description: Include selected route type, effect order and whether the problem occurs after restart. Use headphones for monitoring; do not raise volume to reproduce feedback.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result
      description: Include the visible error, if any, after removing personal paths or identifiers.
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: What changes the result?
      description: Does it also occur with no effects, effects bypassed, monitoring off, or another supported route?
  - type: textarea
    id: audio-unit
    attributes:
      label: Audio Unit details (for effect problems)
      description: Compatibility varies by plug-in and version; MicLine does not guarantee every Audio Unit. Include name, vendor, version, AU format, native or generic editor, and whether the failure occurs when adding, opening controls, processing, or restoring state. Does a built-in Apple effect work? Do not attach presets, licenses, plug-in binaries or state.
      placeholder: "Example: Vendor / Effect / version; native editor opens but processing stops; built-in Apple effect works."
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostics and screenshots
      description: Optionally attach the MicLine diagnostic export. It excludes audio, device names/UIDs, plugin paths/state and raw logs. Attachments are not uploaded by the app. Do not paste credentials or unreviewed Console output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed this report and its attachments for private information and microphone content.
          required: true
